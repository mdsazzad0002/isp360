# Runs on every push and pull request: a fresh database from the migrations, the full test
# suite (including the page smoke test), the ledger check, the front-end build and the
# dependency audits. A red run must be fixed before merging.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: isp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: isp
      DB_USERNAME: root
      DB_PASSWORD: ci
      SUBANDL_ENFORCE_LICENSE: "false"
      SUBANDL_WEB_SCHEDULER: "false"
      SUBANDL_SCHEDULE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, intl, gd, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Fresh database (every migration from zero, then the seed)
        run: php artisan migrate:fresh --seed --force

      - name: Tests
        run: php artisan test

      - name: Ledger check
        run: php artisan isp:ledger-check

      - name: Front-end build
        run: |
          npm ci
          npm run build

      - name: Dependency audit
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high
